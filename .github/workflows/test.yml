name: Tests

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  test-step-2-1:
    name: "Step 2.1 — Detection"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: step_2_1_detection
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: step_2_1_detection/requirements.txt

      - name: Install minimal deps (no ultralytics -- too heavy for CI)
        run: |
          pip install --upgrade pip
          pip install pytest pillow pyyaml

      - name: Run unit tests
        run: pytest tests/ -v --tb=short
